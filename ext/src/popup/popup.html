<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soma Capture</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #1a1a1a;
    }
    .stats {
      background: #f5f5f5;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .stat-row:last-child {
      margin-bottom: 0;
    }
    .stat-label {
      color: #666;
    }
    .stat-value {
      font-weight: 600;
      color: #1a1a1a;
    }
    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button:last-child {
      margin-bottom: 0;
    }
    .btn-primary {
      background: #007aff;
      color: white;
    }
    .btn-primary:hover {
      background: #0051d5;
    }
    .btn-secondary {
      background: #e5e5e5;
      color: #1a1a1a;
    }
    .btn-secondary:hover {
      background: #d1d1d1;
    }
    .btn-danger {
      background: #ff3b30;
      color: white;
    }
    .btn-danger:hover {
      background: #cc0000;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Soma Behavioral Capture</h1>
  
  <div class="stats">
    <div class="stat-row">
      <span class="stat-label">Mouse movements:</span>
      <span class="stat-value" id="movementCount">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Keystroke sequences:</span>
      <span class="stat-value" id="keystrokeCount">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Scroll gestures:</span>
      <span class="stat-value" id="scrollCount">0</span>
    </div>
  </div>

  <button class="btn-primary" id="exportBtn">Export JSON</button>
  <button class="btn-secondary" id="refreshBtn">Refresh Stats</button>
  <button class="btn-danger" id="clearBtn">Clear All Data</button>

  <p class="note">
    Data is stored locally in this browser. Nothing is sent anywhere.
    Export the JSON file and use it to train soma's ONNX model.
  </p>

  <script src="popup.js"></script>
</body>
</html>
